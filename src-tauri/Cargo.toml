[package]
name = "mikrogit"
version = "0.1.0"
description = "Mikrogit - native cross-platform Git client"
authors = ["mikrogit"]
edition = "2021"

[lib]
name = "mikrogit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "sync", "time"] }
thiserror = "2"
notify = "6"
notify-debouncer-mini = "0.4"

[dev-dependencies]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
