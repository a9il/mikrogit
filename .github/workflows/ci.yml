name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check

  check-rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
        working-directory: src-tauri

  build-linux:
    needs: [check-frontend, check-rust]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux deps
        run: >
          sudo apt-get update &&
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential
          libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build -- --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: mikrogit-linux
          path: src-tauri/target/release/bundle/

  build-windows:
    needs: [check-frontend, check-rust]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build -- --bundles nsis,msi
      - uses: actions/upload-artifact@v4
        with:
          name: mikrogit-windows
          path: src-tauri/target/release/bundle/
