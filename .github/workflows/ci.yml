name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only runs when the commit message (or PR title) contains [ci] —
# the gate job decides and every other job waits for it.
jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          MSG_PUSH: ${{ github.event.head_commit.message }}
          MSG_PR: ${{ github.event.pull_request.title }}
        run: |
          if [ "$EVENT" = "push" ]; then MSG="$MSG_PUSH"; else MSG="$MSG_PR"; fi
          echo "commit/PR title: $MSG"
          case "$MSG" in
            *"[ci]"*|*"[CI]"*)
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "CI requested — running full pipeline"
              ;;
            *)
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "CI skipped — include [ci] in the commit message to run"
              ;;
          esac

  check-frontend:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check

  check-rust:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux deps
        run: >
          sudo apt-get update &&
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential
          libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: cargo test --locked
        working-directory: src-tauri

  build-linux:
    needs: [gate, check-frontend, check-rust]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux deps
        run: >
          sudo apt-get update &&
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential
          libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build -- --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: mikrogit-linux
          path: src-tauri/target/release/bundle/

  build-windows:
    needs: [gate, check-frontend, check-rust]
    if: needs.gate.outputs.run == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build -- --bundles nsis,msi
      - uses: actions/upload-artifact@v4
        with:
          name: mikrogit-windows
          path: src-tauri/target/release/bundle/
